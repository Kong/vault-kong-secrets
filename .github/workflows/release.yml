name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${spec%/*}"
            GOARCH="${spec#*/}"
            ext=""
            [ "$GOOS" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags "-s -w -X main.runningVersion=${VERSION}" \
              -o "dist/vault-kong-secrets_${GOOS}_${GOARCH}${ext}" .
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -tags openbao -trimpath \
              -ldflags "-s -w -X main.runningVersion=${VERSION}" \
              -o "dist/openbao-kong-secrets_${GOOS}_${GOARCH}${ext}" .
          done
          (cd dist && sha256sum vault-kong-secrets_* openbao-kong-secrets_*) > dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
